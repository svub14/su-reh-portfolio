<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Su Reh — Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="nav-name">Su Reh</a>
      <ul class="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="projects.html" data-page="projects">Projects</a></li>
        <li><a href="about.html" data-page="about">About</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <video class="hero-bg-video" autoplay muted loop playsinline>
        <source src="assets/videos/hero-bg.mp4" type="video/mp4">
      </video>
      <div class="hero-bg-overlay"></div>
      <div class="hero-content">
        <p class="hero-eyebrow">Mechanical Engineering · Stanford University</p>
        <h1 id="hero-name">Su Reh</h1>
        <p class="lead" id="hero-intro"></p>
        <div class="hero-actions">
          <a href="projects.html" class="btn btn-primary">View Projects</a>
          <a href="#" class="btn" data-linkedin-link target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </div>
    </section>

    <section class="section container">
      <div class="section-head">
        <h2>Featured Projects</h2>
        <a href="projects.html" class="view-all">View All</a>
      </div>
      <div class="project-grid" id="featured-grid"></div>
    </section>
  </main>

  <footer class="site-footer container">
    <span>&copy; <span id="year"></span> Su Reh</span>
    <span>
      <a href="#" data-email-link>sreh14@stanford.edu</a> ·
      <a href="#" data-linkedin-link target="_blank" rel="noopener">LinkedIn</a>
    </span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("hero-name").textContent = PROFILE.name;
    document.getElementById("hero-intro").textContent = PROFILE.homeIntro;
    document.getElementById("year").textContent = new Date().getFullYear();

    const featured = PROJECTS.filter((p) => p.featured).slice(0, 3);
    const gridSource = featured.length ? featured : PROJECTS.slice(0, 3);
    renderProjectGrid(document.getElementById("featured-grid"), gridSource);
  </script>
</body>
</html>
